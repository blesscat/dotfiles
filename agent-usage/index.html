<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent 用量">
<title>Agent 用量</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --text: #1d1f23; --dim: #6b6f76; --line: #e3e3de;
    --track: #ebebe6; --green: #2f9e5b; --yellow: #c98a0b; --red: #d2423b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --card: #202226; --text: #ececea; --dim: #9a9ea6; --line: #2e3036;
      --track: #30333a; --green: #4cc27e; --yellow: #e4ac35; --red: #f0665f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
  #status { color: var(--dim); font-size: 13px; text-align: right; }
  #status.error { color: var(--red); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .name { font-weight: 650; font-size: 17px; }
  .plan { color: var(--dim); font-size: 13px; margin-left: 6px; font-weight: 400; }
  .age { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .age.stale { color: var(--yellow); }
  .note { color: var(--dim); font-size: 14px; }
  .note.warn { color: var(--yellow); font-size: 13px; margin-bottom: 10px; }
  .win + .win { margin-top: 14px; }
  .win-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .label { color: var(--dim); font-size: 14px; }
  .pct { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 15px; font-weight: 600; margin-left: 1px; }
  .bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 6px 0 5px; }
  .fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .reset { color: var(--dim); font-size: 12.5px; }
  .green { color: var(--green); } .yellow { color: var(--yellow); } .red { color: var(--red); }
  .bg-green { background: var(--green); } .bg-yellow { background: var(--yellow); } .bg-red { background: var(--red); }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Agent 剩餘用量</h1>
    <div id="status">載入中…</div>
  </header>
  <div id="agents"></div>
  <footer>每 30 秒自動更新 · Claude / Codex / Antigravity 來自這台機器上最近一次使用時的紀錄，ZCode / MiniMax 每 5 分鐘向官方 API 查一次</footer>
</main>
<script>
const REFRESH_MS = 30000;
const STALE_SECONDS = 6 * 3600;

function level(remaining) {
  if (remaining > 50) return 'green';
  if (remaining >= 20) return 'yellow';
  return 'red';
}

function duration(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  const d = Math.floor(seconds / 86400), h = Math.floor(seconds % 86400 / 3600), m = Math.floor(seconds % 3600 / 60);
  if (d) return `${d} 天 ${h} 小時`;
  if (h) return `${h} 小時 ${m} 分`;
  return `${m} 分鐘`;
}

function ago(seconds) {
  if (seconds < 60) return '剛剛';
  if (seconds < 3600) return `${Math.floor(seconds / 60)} 分鐘前`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小時前`;
  return `${Math.floor(seconds / 86400)} 天前`;
}

function resetText(win, now) {
  if (win.reset_passed) return '已重置（等下次使用時更新）';
  if (!win.resets_at) return '';
  const when = new Date(win.resets_at * 1000);
  const sameDay = when.toDateString() === new Date(now * 1000).toDateString();
  const fmt = sameDay
    ? { hour: '2-digit', minute: '2-digit', hour12: false }
    : { weekday: 'short', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
  return `重置：${when.toLocaleString('zh-TW', fmt)}（還有 ${duration(win.resets_at - now)}）`;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderAgent(agent, now) {
  const card = el('section', 'card');
  const head = el('div', 'card-head');
  const title = el('div', 'name', agent.name);
  if (agent.plan) title.append(el('span', 'plan', agent.plan));
  head.append(title);
  if (agent.at) {
    const age = now - agent.at;
    head.append(el('span', 'age' + (age > STALE_SECONDS ? ' stale' : ''), `更新於 ${ago(age)}`));
  }
  card.append(head);
  if (agent.note) card.append(el('div', agent.windows.length ? 'note warn' : 'note', agent.note));
  if (!agent.windows.length) {
    if (!agent.note) card.append(el('div', 'note', '沒有資料'));
    return card;
  }
  for (const win of agent.windows) {
    const remaining = Math.round(win.remaining);
    const color = level(remaining);
    const row = el('div', 'win');
    const top = el('div', 'win-head');
    top.append(el('span', 'label', win.label));
    const pct = el('span', `pct ${color}`, win.unlimited ? '無上限' : String(remaining));
    if (!win.unlimited) pct.append(el('small', '', '%'));
    top.append(pct);
    const bar = el('div', 'bar');
    const fill = el('div', `fill bg-${color}`);
    fill.style.width = `${remaining}%`;
    bar.append(fill);
    row.append(top, bar, el('div', 'reset', resetText(win, now)));
    card.append(row);
  }
  return card;
}

async function refresh() {
  const status = document.getElementById('status');
  try {
    const response = await fetch('/api/usage', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const list = document.getElementById('agents');
    list.replaceChildren(...data.agents.map(agent => renderAgent(agent, data.now)));
    status.className = '';
    status.textContent = new Date(data.now * 1000).toLocaleTimeString('zh-TW', { hour12: false });
  } catch (error) {
    status.className = 'error';
    status.textContent = '連不上，稍後重試';
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

// Installing as an app and opening offline need a service worker, which browsers only allow over HTTPS.
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
