minimumLimaVersion: 2.2.0
vmType: vz
arch: aarch64
cpus: 6
memory: "12GiB"
disk: "100GiB"

ssh:
  localPort: 62180
  # Forward the host agent; never copy private SSH keys into the guest.
  forwardAgent: true

base:
  - template:_images/ubuntu

containerd:
  system: false
  user: false

# Cider remains available for shared host/guest tooling. Project checkouts,
# dependencies, Codex state, Docker data, and database data remain guest-local.
mounts:
  - location: "~/.cider"
    writable: true

portForwards:
  - guestSocket: "/var/run/docker.sock"
    hostSocket: "{{.Dir}}/sock/docker.sock"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      apt-get update
      apt-get install -y ca-certificates curl git rsync
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker "{{.User}}"
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail
      /bin/bash /Users/blesscat/.cider/scripts/lima_guest_layout.sh
